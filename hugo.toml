baseURL = 'https://catzer.github.io/matingi/'
languageCode = 'en-us'
title = 'Cloud Architecture & DevOps Blog'
theme = 'PaperMod'
paginate = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "Cloud Architecture & DevOps Blog"
description = "Technical blog documenting cloud architecture, DevOps practices, and SRE projects"
keywords = ["Cloud Architecture", "DevOps", "SRE", "AWS", "Kubernetes", "CI/CD"]
author = "jnziokah@gmail.com"
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[params.homeInfoParams]
Title = "Welcome to My Technical Blog 👋"
Content = """
Hi! I document my journey in cloud architecture, DevOps, and Site Reliability Engineering.
Here you'll find practical guides, architecture decisions, and lessons learned from real-world projects.

**Topics I cover:**
- ☁️ Cloud Architecture (AWS, Azure, GCP)
- 🔧 DevOps Tools & Practices
- 🚀 CI/CD Pipelines
- ⚙️ Infrastructure as Code
- 📊 Monitoring & Observability
- 🛡️ Security & Compliance
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/catzer"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/jeremiahnziokamutungi"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[params.cover]
hidden = false
hiddenInList = false
hiddenInSingle = false

[params.editPost]
URL = "https://github.com/catzer/matingi/tree/main/content"
Text = "Suggest Changes"
appendFilePath = true

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 30

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.highlight]
noClasses = false
anchorLineNos = false
codeFences = true
guessSyntax = true
lineNos = true
style = "monokai"
